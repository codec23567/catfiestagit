name: Modify Post

on:
  workflow_dispatch:
    inputs:
      id:
        description: "User ID"
        required: true
        type: string

      pw:
        description: "User Password"
        required: true
        type: string

      url:
        description: "Modify URL"
        required: true
        type: string

      html:
        description: "HTML"
        required: true
        type: string

jobs:
  modify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        run: python run.py
